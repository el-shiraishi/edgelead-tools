<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エッジリード文面生成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f3f5f7;
    --panel: #ffffff;
    --ink: #1e2530;
    --ink-soft: #5a6472;
    --line: #e1e5ea;
    --accent: #0f6f6a;
    --accent-soft: #e3f1ef;
    --accent-ink: #0b524e;
    --warn: #b5532c;
    --warn-soft: #fbeae1;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  header.top h1{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700; font-size: 22px; letter-spacing: .02em; margin:0;
    display:flex; align-items:center; gap:10px;
  }
  header.top h1 .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width: 34px; height:34px; border-radius: 9px;
    background: var(--accent); color:#fff; font-size:16px; font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  header.top .sub{ font-size:12.5px; color: var(--ink-soft); }

  /* tabs */
  .tabs{ display:flex; gap:6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tab{
    appearance:none; border:none; background:none; cursor:pointer;
    padding: 11px 18px; font-size: 14px; font-weight:600; color: var(--ink-soft);
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
    font-family:'Noto Sans JP', sans-serif;
  }
  .tab:hover{ color: var(--ink); }
  .tab.active{ color: var(--accent-ink); border-bottom-color: var(--accent); }

  .grid{
    display:grid; grid-template-columns: 1.05fr 1fr; gap: 22px; align-items:start;
  }
  @media (max-width: 880px){ .grid{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    padding: 22px; box-shadow: 0 1px 2px rgba(20,30,40,.03);
  }
  .panel h2{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size: 14px; font-weight:700; margin: 0 0 14px; color: var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  .panel h2::before{
    content:''; width:4px; height:14px; background: var(--accent); border-radius:2px; display:inline-block;
  }

  /* company chips */
  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 20px; }
  .chip{
    appearance:none; cursor:pointer; border:1px solid var(--line); background:#fbfcfd;
    color: var(--ink); font-size: 13px; font-weight:600; padding: 8px 14px;
    border-radius: 999px; transition: all .12s; font-family:'Noto Sans JP', sans-serif;
    white-space:nowrap;
  }
  .chip:hover{ border-color: var(--accent); color: var(--accent-ink); }
  .chip.active{ background: var(--accent); border-color: var(--accent); color:#fff; }

  .badge-note{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    color: var(--warn); background: var(--warn-soft); padding: 6px 10px; border-radius: 8px;
    margin-bottom: 16px;
  }
  .badge-note--doc{
    color: #0c6b91; background: #e3f3fa;
  }
  .sample-link{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    color: var(--accent-ink); background: var(--accent-soft); padding: 6px 10px; border-radius: 8px;
    margin-bottom: 16px; margin-left: 8px; text-decoration:none; cursor:pointer;
  }
  .sample-link:hover{ text-decoration: underline; }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size: 12.5px; font-weight:600; color: var(--ink-soft); margin-bottom: 5px;
  }
  .field label .opt{ font-weight:400; color:#9aa4b1; }
  .field label .hint{ font-weight:700; color: var(--warn); font-size: 11.5px; margin-left: 2px; }
  .field-note{
    font-size: 11.5px; color: var(--warn); background: var(--warn-soft);
    border-radius: 6px; padding: 6px 9px; margin-top: 6px; white-space: pre-line; line-height:1.5;
  }
  .field input{
    width:100%; padding: 9px 11px; font-size: 14px; border: 1px solid var(--line);
    border-radius: 8px; background: #fbfcfd; color: var(--ink);
    font-family:'Noto Sans JP', sans-serif; transition: border-color .12s, background .12s;
  }
  .field input:focus{ outline:none; border-color: var(--accent); background:#fff; }
  .field select{
    width:100%; padding: 9px 11px; font-size: 14px; border: 1px solid var(--line);
    border-radius: 8px; background: #fbfcfd; color: var(--ink);
    font-family:'Noto Sans JP', sans-serif; transition: border-color .12s, background .12s;
  }
  .field select:focus{ outline:none; border-color: var(--accent); background:#fff; }
  .check-group{
    display:flex; flex-wrap:wrap; gap: 6px 14px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background:#fbfcfd;
  }
  .check-item{ display:flex; align-items:center; gap:6px; font-size: 13px; }
  .check-item input{ width:auto; margin:0; }

  .empty-state{
    color: var(--ink-soft); font-size: 13.5px; padding: 30px 10px; text-align:center;
    border: 1px dashed var(--line); border-radius: 10px; background:#fbfcfd;
  }
  .todo-state{
    color: var(--warn); font-size: 13px; padding: 16px; border-radius:10px;
    background: var(--warn-soft); margin-bottom: 6px;
  }

  /* output */
  .output-panel{ position: sticky; top: 20px; }
  .memo{
    background: #fbfaf6; border:1px solid var(--line); border-radius: 10px;
    padding: 20px 18px 18px; min-height: 260px;
    font-family: var(--mono); font-size: 13px; color: var(--ink);
    white-space: pre-wrap; word-break: break-word;
    background-image: linear-gradient(var(--accent-soft) 0 1px, transparent 1px);
    background-size: 100% 26px;
    line-height: 26px;
    position: relative;
  }
  .memo.is-empty{ color:#9aa4b1; background-image:none; line-height:1.6; }
  .memo::before{
    content:'GENERATED';
    position:absolute; top:-9px; left:14px; background: var(--panel);
    font-family:'Noto Sans JP', sans-serif; font-size:10px; letter-spacing:.12em;
    color: var(--accent-ink); font-weight:700; padding: 0 6px;
  }

  .copy-row{ display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-top: 14px; }
  .clear-btn{
    appearance:none; cursor:pointer; border:1px solid var(--line); background:#fff; color: var(--ink-soft);
    font-size: 13px; font-weight:600; padding: 10px 14px; border-radius: 9px;
    font-family:'Noto Sans JP', sans-serif; transition: all .12s;
  }
  .clear-btn:hover{ border-color: var(--warn); color: var(--warn); }
  .clear-btn.confirm{ background: var(--warn); border-color: var(--warn); color:#fff; }
  .copy-btn{
    appearance:none; cursor:pointer; border:none; background: var(--accent); color:#fff;
    font-size: 13.5px; font-weight:700; padding: 10px 18px; border-radius: 9px;
    display:inline-flex; align-items:center; gap:8px; transition: background .12s, transform .05s;
    font-family:'Noto Sans JP', sans-serif;
  }
  .copy-btn:hover{ background: var(--accent-ink); }
  .copy-btn:active{ transform: scale(.97); }
  .copy-btn.copied{ background:#3a8f4a; }

  /* ===== 推薦後フロー ===== */
  .wrap.wide{ max-width: 1560px; }
  .grid.grid-3{ grid-template-columns: minmax(0,1fr) minmax(0,.9fr) minmax(0,1.05fr); }
  @media (max-width: 1239px){
    .grid.grid-3{ grid-template-columns: 1.05fr 1fr; }
    .grid.grid-3 .flow-panel{ grid-column: 1 / -1; }
  }
  @media (max-width: 880px){ .grid.grid-3{ grid-template-columns: 1fr; } }
  .flow-panel{ container-type:inline-size; }
  @media (min-width: 1240px){
    .grid.grid-3 .flow-panel{ position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; }
  }
  .flow-empty{ color:var(--ink-soft); font-size:13px; padding:14px; background:#f7f9fa; border:1px dashed var(--line); border-radius:10px; }
  .flow-legend{ display:flex; flex-wrap:wrap; gap:6px 12px; margin:0 0 14px; font-size:12px; color:var(--ink-soft); }
  .flow-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .flow-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .flow-vtabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .flow-vtab{ appearance:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 13px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:inherit; }
  .flow-vtab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .flow-refs{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .flow-refs a, .flow-body a{ color:#0c6b91; word-break:break-all; }
  .flow-refs a{ display:block; padding:7px 10px; background:#e3f3fa; border-radius:8px; font-size:12.5px; text-decoration:none; }
  .flow-refs a:hover{ text-decoration:underline; }
  .flow-list{ list-style:none; margin:0; padding:0; }
  .flow-item{ position:relative; margin:0 0 20px; }
  .flow-item:last-child{ margin-bottom:0; }
  .flow-item:not(:last-child)::after{ content:'▼'; position:absolute; left:50%; bottom:-17px; transform:translateX(-50%); font-size:10px; color:#b6bec8; line-height:1; }
  .flow-card{ --c:#9aa5b1; background:#fff; border:1px solid var(--line); border-left:5px solid var(--c); border-radius:10px; padding:9px 12px 10px; }
  .flow-card.a-ca{ --c:#6fa8dc; } .flow-card.a-el{ --c:#f6b26b; } .flow-card.a-co{ --c:#1155cc; } .flow-card.a-js{ --c:#46bdc6; }
  .flow-card.a-x{ --c:#c3cad2; background:#f8f9fa; }
  .flow-tag{ display:inline-block; font-size:10.5px; font-weight:700; padding:1px 8px; border-radius:999px; color:#fff; background:var(--c); margin-bottom:3px; letter-spacing:.02em; }
  .flow-card.a-el .flow-tag{ color:#5a3200; } .flow-card.a-x .flow-tag{ color:#fff; }
  .flow-title{ font-weight:700; font-size:14px; line-height:1.45; }
  .flow-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .flow-body{ font-size:12.5px; margin-top:6px; white-space:pre-wrap; word-break:break-word; color:#2c3440; }
  .flow-call{ margin-top:7px; padding:6px 10px; border-radius:8px; background:#fff4d6; color:#7a5200; font-size:12.5px; font-weight:600; white-space:pre-wrap; }
  .flow-note{ margin-top:7px; border:1px solid var(--line); border-radius:8px; background:#f7f9fa; }
  .flow-note summary{ cursor:pointer; padding:5px 10px; font-size:12px; font-weight:600; color:var(--accent-ink); }
  .flow-note > div{ padding:2px 10px 9px; font-size:12px; white-space:pre-wrap; word-break:break-word; color:#2c3440; }
  .flow-split{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @container (max-width: 460px){ .flow-split{ grid-template-columns:1fr; } }
  .flow-cell{ display:flex; flex-direction:column; }
  .flow-label{ align-self:flex-start; font-size:11px; font-weight:700; padding:2px 9px; border-radius:7px 7px 0 0; background:#37424f; color:#fff; }
  .flow-cell .flow-card{ border-top-left-radius:0; flex:1; }
  .flow-branch{ margin:8px 0 0 14px; padding-left:10px; border-left:2px dashed #c3cad2; }
  .flow-branch-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .flow-branch .flow-card{ margin-bottom:6px; }
  .flow-extra{ border:1px dashed #b6bec8; border-radius:10px; padding:9px 12px; background:#fafbfc; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1><span class="mark">E</span>エッジリード文面生成ツール</h1>
    <div class="sub">会社を選ぶと、入力項目とフォーマットが自動で切り替わります</div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="identity">人物照合</button>
    <button class="tab" data-tab="job">案件確認</button>
    <button class="tab" data-tab="progress">進捗状況確認</button>
    <button class="tab" data-tab="line">LINE推薦文面</button>
  </div>

  <!-- 人物照合 TAB -->
  <div class="tab-panel" id="tab-identity">
    <div class="grid">
      <div class="panel">
        <h2>会社を選択</h2>
        <div class="chip-grid" id="identityChips"></div>
        <div id="identityBadge"></div>
        <div id="identityFields"></div>
      </div>

      <div class="panel output-panel">
        <h2>生成された文面</h2>
        <div class="memo is-empty" id="identityOutput">← 会社を選択して入力してください</div>
        <div class="copy-row">
          <button class="copy-btn" id="identityCopy">📋 コピー</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 案件確認 TAB -->
  <div class="tab-panel" id="tab-job" style="display:none;">
    <div class="grid">
      <div class="panel">
        <h2>会社を選択</h2>
        <div class="chip-grid" id="jobChips"></div>
        <div id="jobBadge"></div>
        <div id="jobFields"></div>
      </div>

      <div class="panel output-panel">
        <h2>生成された文面</h2>
        <div class="memo is-empty" id="jobOutput">← 会社を選択して入力してください</div>
        <div class="copy-row">
          <button class="copy-btn" id="jobCopy">📋 コピー</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 進捗状況確認 TAB -->
  <div class="tab-panel" id="tab-progress" style="display:none;">
    <div class="grid">
      <div class="panel">
        <h2>会社を選択</h2>
        <div class="chip-grid" id="progressChips"></div>
        <div id="progressBadge"></div>
        <div id="progressFields"></div>
      </div>

      <div class="panel output-panel">
        <h2>生成された文面</h2>
        <div class="memo is-empty" id="progressOutput">← 会社を選択して入力してください</div>
        <div class="copy-row">
          <button class="copy-btn" id="progressCopy">📋 コピー</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LINE推薦文面 TAB -->
  <div class="tab-panel" id="tab-line" style="display:none;">
    <div class="grid grid-3">
      <div class="panel">
        <h2>会社を選択</h2>
        <div class="chip-grid" id="lineChips"></div>
        <div id="lineBadge"></div>
        <div id="lineFields"></div>
      </div>

      <div class="panel output-panel">
        <h2>生成された文面</h2>
        <div class="memo is-empty" id="lineOutput">← 会社を選択して入力してください</div>
        <div class="copy-row">
          <button class="copy-btn" id="lineCopy">📋 コピー</button>
        </div>
      </div>

      <div class="panel flow-panel">
        <h2>推薦後フロー</h2>
        <div id="lineFlow"><div class="flow-empty">← 会社を選択すると、推薦後の流れが表示されます</div></div>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------------------------------------------------------
   会社ごとの設定
   fields: フォームに出す入力項目 { id, label, optional }
   badge : 一覧上の注意書き（あれば）
   generate(v): 入力値から文面を組み立てる関数
--------------------------------------------------------- */
const companies = {
  NT: {
    label: 'NT',
    fields: [
      { id:'tantou', label:'担当者名' },
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },
      { id:'tel', label:'電話番号', hint:'※ハイフンなし', note:'※携帯電話が停止されていて使えない場合でもその番号を入力\n※番号がどうしてもない場合は0を入力' },
      { id:'mail', label:'メールアドレス', hint:'※任意' },
    ],
    generate: v => `お世話になっております。\n照合お願いします。\n\n担当者名：${v.tantou}\n\n氏名：${v.name}\nフリガナ：${v.furigana}\n生年月日：${v.birth}\n電話番号：${v.tel}\nメールアドレス：${v.mail}`
  },
  WIC: {
    label: 'WIC',
    fields: [
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },
      { id:'tel', label:'電話番号' },
    ],
    generate: v => `お世話になっております。\n照合お願いします。\n\n氏名：${v.name}\nフリガナ：${v.furigana}\n生年月日：${v.birth}\n電話番号：${v.tel}`
  },
  BN: {
    label: 'BN',
    fields: [
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },
      { id:'tel', label:'電話番号' },
    ],
    generate: v => `お世話になっております。\n照合お願いします。\n\n氏名：${v.name}\nフリガナ：${v.furigana}\n生年月日：${v.birth}\n電話番号：${v.tel}`
  },
  'CO/COH': {
    label: 'CO/COH',
    fields: [
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },
      { id:'tel', label:'電話番号' },
      { id:'mail', label:'メールアドレス', optional:true, note:'※Jobuddyのチェックができないため、送付時に送付できない可能性があります。\nJobuddyの確認も必要であれば、メールアドレスも記載お願いします。' },
    ],
    generate: v => `お世話になっております。\n照合お願いします。\n\n氏名：${v.name}\nフリガナ：${v.furigana}\n生年月日：${v.birth}\n電話番号：${v.tel}\nメールアドレス（あれば）：${v.mail}`
  },
  NK: {
    label: 'NK',
    fields: [
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },
      { id:'tel', label:'電話番号' },
    ],
    generate: v => `お世話になっております。\n照合お願いします。\n\n氏名：${v.name}\nフリガナ：${v.furigana}\n生年月日：${v.birth}\n電話番号：${v.tel}`
  },
  TKG: {
    label: 'TKG',
    badge: '※推薦前の照合必須',
    fields: [
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },
      { id:'tel', label:'電話番号' },
    ],
    generate: v => `お世話になっております。\n照合お願いします。\n\n氏名：${v.name}\nフリガナ：${v.furigana}\n生年月日：${v.birth}\n電話番号：${v.tel}`
  },
  WT: {
    label: 'WT',
    fields: [
      { id:'name', label:'氏名', placeholder:'例）山田　太郎', hint:'※全角スペース' },
      { id:'furigana', label:'フリガナ', placeholder:'例）ヤマダ　タロウ', hint:'※全角スペース' },
      { id:'birth', label:'生年月日', placeholder:'例）1987/02/16' },

/* ---------------------------------------------------------
   汎用ツール初期化：company一覧 + 生成ロジックを
   チップ / フォーム / 出力パネルに結びつける
--------------------------------------------------------- */
function initTool(prefix, companiesCfg, order, prependCompanyLabel, onSelect){
  let currentCompany = null;
  let values = {};

  const chipContainer = document.getElementById(prefix + 'Chips');
  const badgeNoteEl = document.getElementById(prefix + 'Badge');
  const formFieldsEl = document.getElementById(prefix + 'Fields');
  const outputEl = document.getElementById(prefix + 'Output');
  const copyBtn = document.getElementById(prefix + 'Copy');

  order.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = companiesCfg[key].label;
    btn.dataset.key = key;
    btn.addEventListener('click', () => selectCompany(key));
    chipContainer.appendChild(btn);
  });

  function selectCompany(key){
    currentCompany = key;
    // 入力値は会社を切り替えても保持する（同じ項目IDの入力内容が引き継がれる）
    [...chipContainer.children].forEach(c => c.classList.toggle('active', c.dataset.key === key));
    renderForm();
    updateOutput();
    if (onSelect) onSelect(key);
  }

  function renderForm(){
    const cfg = companiesCfg[currentCompany];
    badgeNoteEl.innerHTML = '';
    formFieldsEl.innerHTML = '';

    const rawBadge = (typeof cfg.badge === 'function') ? cfg.badge(values) : cfg.badge;
    const badgeList = Array.isArray(rawBadge) ? rawBadge.filter(Boolean) : (rawBadge ? [rawBadge] : []);
    badgeList.forEach(text => {
      const b = document.createElement('div');
      b.className = 'badge-note' + (text.startsWith('【必要な書類】') ? ' badge-note--doc' : '');
      b.textContent = text;
      badgeNoteEl.appendChild(b);
    });

    if (cfg.sample){
      const a = document.createElement('a');
      a.className = 'sample-link';
      a.href = cfg.sample.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '📄 ' + cfg.sample.label;
      badgeNoteEl.appendChild(a);
    }

    if (!cfg.generate){
      formFieldsEl.innerHTML = `<div class="todo-state">${cfg.label} のテンプレートはまだ登録されていません。文言を教えていただければ追加します。</div>`;
      return;
    }

    const fieldList = (typeof cfg.fields === 'function') ? cfg.fields(values) : cfg.fields;
    fieldList.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const label = document.createElement('label');
      label.innerHTML = f.label + (f.optional ? ' <span class="opt">(任意)</span>' : '') + (f.hint ? ' <span class="hint">' + f.hint + '</span>' : '');
      if (f.label) wrap.appendChild(label);

      if (f.type === 'info'){
        // display-only: label + note act as a static confirmation block, no input control
      } else if (f.type === 'select'){
        const select = document.createElement('select');
        select.dataset.id = f.id;
        const blank = document.createElement('option');
        blank.value = ''; blank.textContent = '選択してください';
        select.appendChild(blank);
        f.options.forEach(opt => {
          const o = document.createElement('option');
          o.value = opt; o.textContent = opt;
          select.appendChild(o);
        });
        select.addEventListener('change', () => {
          values[f.id] = select.value;
          if (f.controlsForm) renderForm();
          updateOutput();
        });
        // 会社切り替え時の引き継ぎ：選択肢に無い値は「男性⇔男」のように変換し、変換できなければ破棄
        let cur = values[f.id];
        if (cur && !f.options.includes(cur)){
          const alt = [cur.replace(/性$/, ''), cur + '性'].find(x => f.options.includes(x));
          if (alt){ cur = alt; values[f.id] = alt; }
          else { cur = ''; delete values[f.id]; }
        }
        if (cur) select.value = cur;
        wrap.appendChild(select);
      } else if (f.type === 'multiselect'){
        const group = document.createElement('div');
        group.className = 'check-group';
        const savedChecks = (values[f.id] || '').split('、');
        f.options.forEach((opt, i) => {
          const item = document.createElement('label');
          item.className = 'check-item';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = opt;
          cb.checked = savedChecks.includes(opt);
          cb.addEventListener('change', () => {
            const checked = [...group.querySelectorAll('input:checked')].map(c => c.value);
            values[f.id] = checked.length ? checked.join('、') : (f.noneLabel || '');
            updateOutput();
          });
          item.appendChild(cb);
          item.appendChild(document.createTextNode(opt));
          group.appendChild(item);
        });
        wrap.appendChild(group);
      } else {
        const input = document.createElement('input');
        input.type = (f.type === 'date') ? 'date' : 'text';
        input.dataset.id = f.id;
        if (f.placeholder) input.placeholder = f.placeholder;
        input.addEventListener('input', () => {
          values[f.id] = (f.type === 'date') ? input.value.replace(/-/g, '/') : input.value;
          updateOutput();
        });
        if (values[f.id]) input.value = (f.type === 'date') ? values[f.id].replace(/\//g, '-') : values[f.id];
        wrap.appendChild(input);
      }

      if (f.note){
        const noteEl = document.createElement('div');
        noteEl.className = 'field-note';
        noteEl.textContent = f.note;
        wrap.appendChild(noteEl);
      }
      formFieldsEl.appendChild(wrap);
    });
  }

  function updateOutput(){
    if (!currentCompany){
      outputEl.textContent = '← 会社を選択して入力してください';
      outputEl.classList.add('is-empty');
      return;
    }
    const cfg = companiesCfg[currentCompany];
    if (!cfg.generate){
      outputEl.textContent = '← このテンプレートはまだ準備中です';
      outputEl.classList.add('is-empty');
      return;
    }
    let text = cfg.generate(new Proxy(values, { get: (t,p) => t[p] ?? '' }));
    if (prependCompanyLabel) text = `${cfg.label}\n${text}`;
    outputEl.textContent = text;
    outputEl.classList.remove('is-empty');
  }

  // 一括クリアボタン（コピーボタンの左隣に追加）
  const clearBtn = document.createElement('button');
  clearBtn.type = 'button';
  clearBtn.className = 'clear-btn';
  const CLEAR_LABEL = '🗑 入力をクリア';
  clearBtn.textContent = CLEAR_LABEL;
  copyBtn.parentNode.insertBefore(clearBtn, copyBtn);
  let clearTimer = null;
  function resetClearBtn(){
    clearTimeout(clearTimer);
    clearBtn.classList.remove('confirm');
    clearBtn.textContent = CLEAR_LABEL;
  }
  clearBtn.addEventListener('click', () => {
    if (!clearBtn.classList.contains('confirm')){
      clearBtn.classList.add('confirm');
      clearBtn.textContent = 'もう一度押すとクリア';
      clearTimer = setTimeout(resetClearBtn, 3000);
      return;
    }
    resetClearBtn();
    values = {};
    if (currentCompany) renderForm();
    updateOutput();
  });

  copyBtn.addEventListener('click', async () => {
    const text = outputEl.textContent;
    if (!text || outputEl.classList.contains('is-empty')) return;
    try{
      await navigator.clipboard.writeText(text);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.textContent = '✅ コピーしました';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '📋 コピー';
      copyBtn.classList.remove('copied');
    }, 1500);
  });

  updateOutput();
}

const ACTOR_CLS = { 'CA':'a-ca', 'EL本部':'a-el', '派遣会社':'a-co', '求職者':'a-js' };

function flowText(el, text){
  const re = /(https?:\/\/[^\s]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = '🔗 リンクを開く'; a.title = m[1];
    el.appendChild(a);
    last = m.index + m[1].length;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}
function fEl(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function flowCard(c){
  const card = fEl('div', 'flow-card ' + (ACTOR_CLS[c.a] || 'a-x'));
  if (c.a) card.appendChild(fEl('span', 'flow-tag', c.a));
  if (c.t) card.appendChild(fEl('div', 'flow-title', c.t));
  if (c.s) card.appendChild(fEl('div', 'flow-sub', c.s));
  if (c.b && c.b.trim()){ const b = fEl('div', 'flow-body'); flowText(b, c.b.replace(/^\n+/, '')); card.appendChild(b); }
  (c.c || []).forEach(t => card.appendChild(fEl('div', 'flow-call', t)));
  (c.n || []).forEach(t => {
    const d = fEl('details', 'flow-note');
    d.appendChild(fEl('summary', null, '📝 補足を見る'));
    const body = fEl('div'); flowText(body, t); d.appendChild(body);
    card.appendChild(d);
  });
  if (c.br){
    const br = fEl('div', 'flow-branch');
    if (c.br.title) br.appendChild(fEl('div', 'flow-branch-title', '↳ ' + c.br.title));
    c.br.cells.forEach(x => {
      if (x.l) br.appendChild(fEl('div', 'flow-branch-title', '↳ ' + x.l));
      if (x.a || x.t || (x.b && x.b.trim())) br.appendChild(flowCard(x));
    });
    card.appendChild(br);
  }
  return card;
}
function renderFlow(key){
  const root = document.getElementById('lineFlow');
  root.textContent = '';
  const f = FLOWS[key];
  if (!f){ root.appendChild(fEl('div', 'flow-empty', 'この会社のフロー情報はありません')); return; }

  const legend = fEl('div', 'flow-legend');
  [['CA','#6fa8dc'],['EL本部','#f6b26b'],['派遣会社','#1155cc'],['求職者','#46bdc6']].forEach(([n,c]) => {
    const s = fEl('span'); const i = fEl('i'); i.style.background = c; s.appendChild(i); s.appendChild(document.createTextNode(n)); legend.appendChild(s);
  });
  root.appendChild(legend);

  if (f.refs && f.refs.length){
    const r = fEl('div', 'flow-refs');
    f.refs.forEach(x => { const a = fEl('a', null, '📎 ' + x.l); a.href = x.u; a.target = '_blank'; a.rel = 'noopener noreferrer'; r.appendChild(a); });
    root.appendChild(r);
  }

  const listWrap = fEl('div');
  const draw = idx => {
    listWrap.textContent = '';
    const ol = fEl('ol', 'flow-list');
    f.variants[idx].steps.forEach(s => {
      const li = fEl('li', 'flow-item');
      if (s.k === 'split'){
        const g = fEl('div', 'flow-split');
        s.cells.forEach(c => {
          const cell = fEl('div', 'flow-cell');
          if (c.l) cell.appendChild(fEl('div', 'flow-label', c.l));
          cell.appendChild(flowCard(c));
          g.appendChild(cell);
        });
        li.appendChild(g);
        (s.n || []).forEach(t => {
          const d = fEl('details', 'flow-note');
          d.appendChild(fEl('summary', null, '📝 補足を見る'));
          const body = fEl('div'); flowText(body, t); d.appendChild(body);
          li.appendChild(d);
        });
      } else if (s.k === 'extra'){
        const e = fEl('div', 'flow-extra');
        if (s.t) e.appendChild(fEl('div', 'flow-title', s.t));
        if (s.b){ const b = fEl('div', 'flow-body'); flowText(b, s.b); e.appendChild(b); }
        li.appendChild(e);
      } else {
        li.appendChild(flowCard(s));
      }
      ol.appendChild(li);
    });
    listWrap.appendChild(ol);
  };
  if (f.variants.length > 1){
    const tabs = fEl('div', 'flow-vtabs');
    f.variants.forEach((v, i) => {
      const b = fEl('button', 'flow-vtab' + (i === 0 ? ' active' : ''), v.name || ('パターン' + (i + 1)));
      b.type = 'button';
      b.addEventListener('click', () => {
        [...tabs.children].forEach(x => x.classList.toggle('active', x === b));
        draw(i);
      });
      tabs.appendChild(b);
    });
    root.appendChild(tabs);
  }
  root.appendChild(listWrap);
  draw(0);
}

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
  document.querySelector('.wrap').classList.toggle('wide', btn.dataset.tab === 'line');
});
